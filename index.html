<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aion 2 Chanter Build</title>
<meta name="description" content="Aion 2 Chanter build (Mour4SB): skill ve uzmanlık sırası (PvE/PvP), stigma, pasif, macro, Daevanion 315/386, Arcana, Genus Insight, Pantheon, mana taşı ve ekipman.">
<link rel="icon" href="icons/ICON_CH_SKILL_019.webp">
<style>
:root{
  --bg:#0b0d12; --panel:#141822; --panel2:#1a1f2c; --line:#262d3f; --line2:#343d55;
  --text:#e7e9ef; --muted:#8e97ad; --dim:#5d667c;
  --gold:#e8c06a; --green:#5fd39a; --greenbg:#15281e; --purple:#b48cff; --purplebg:#231b3a; --red:#ff8080; --orange:#ff9f5a; --blue:#6aa8ff;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--gold)}
button{font:inherit;color:inherit}
.top{border-bottom:1px solid var(--line);background:linear-gradient(180deg,#191529,#0b0d12)}
.top .in{max-width:1240px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.cls{width:44px;height:44px;border-radius:10px;border:1px solid var(--line2)}
.top h1{font-size:20px;margin:0;line-height:1.2}
.top .sub{color:var(--muted);font-size:13px}
.tabs{margin-left:auto;display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:600}
.tabs button.on{background:var(--gold);color:#1b1404}
.layout{max-width:1240px;margin:0 auto;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:16px;scroll-margin-top:56px}
.card>h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0;padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card>h2 .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:400;font-size:12px;color:var(--dim)}
.pad{padding:12px 14px}
.summary{display:flex;gap:10px;flex-wrap:wrap;padding:12px 14px;color:var(--muted)}
.summary b{color:var(--text)}
.pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px}
.foot{padding:8px 14px;color:var(--dim);font-size:12px;border-top:1px solid var(--line)}
kbd{background:#232a3c;border:1px solid var(--line2);border-bottom-width:3px;border-radius:5px;padding:0 6px;font:600 12px ui-monospace,monospace;white-space:nowrap}
footer{max-width:1240px;margin:0 auto;padding:4px 16px 32px;color:var(--dim);font-size:12px}
.muted{color:var(--muted)}
.tipbox{background:#2a2412;border:1px solid #5d4a1c;border-radius:10px;padding:10px 12px;color:var(--muted);font-size:13px}
.tipbox b{color:var(--gold)}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:2px;text-transform:none;letter-spacing:0}
.seg button{border:0;background:none;padding:3px 12px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:700;font-size:12px}
.seg button.on{background:var(--gold);color:#1b1404}
.seg button.pvp.on{background:var(--red);color:#2a0606}
.ic{width:36px;height:36px;border-radius:7px;border:1px solid var(--line2);display:block}

/* build: gezinme */
.jump{position:sticky;top:0;z-index:5;background:#0b0d12e6;backdrop-filter:blur(6px);border-bottom:1px solid var(--line);margin:-16px -16px 16px;padding:8px 16px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.jump::-webkit-scrollbar{display:none}
.jump a{flex:none;text-decoration:none;color:var(--muted);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:600}
.jump a:hover{color:var(--gold);border-color:#5d4a1c}

/* build: özet */
.hero{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.hs{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.hs .h{display:flex;align-items:center;gap:8px;font-weight:800}
.hs .h .n{width:24px;height:24px;flex:none;border-radius:50%;background:var(--gold);color:#1b1404;display:grid;place-items:center;font-size:12px}
.hs .icons{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.hs .icons img{width:30px;height:30px;border-radius:6px;border:1px solid var(--line2)}
.hs .icons .ar{color:var(--gold);font-weight:800}
.hs .d{color:var(--muted);font-size:12.5px}
.hs .d b{color:var(--text)}
.who{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}

/* build: skill listesi */
.skl{list-style:none;margin:0;padding:0}
.skl>li{display:grid;grid-template-columns:26px 40px minmax(0,1fr);gap:10px;padding:10px 14px;border-top:1px solid var(--line);align-items:start}
.skl>li:first-child{border-top:0}
.skl>li.key{background:linear-gradient(90deg,#2a241255,transparent 60%)}
.skl .n{font-weight:900;color:var(--gold);text-align:right;padding-top:9px}
.skl .ic{width:40px;height:40px}
.skl .nm{font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.skl .to{color:var(--gold);font-weight:800}
.skl .tag{font-size:10.5px;font-weight:800;border-radius:5px;padding:0 6px;line-height:17px}
.tag.key{background:#3a2f12;color:var(--gold);border:1px solid #5d4a1c}
.tag.pvp{background:#2a1718;color:var(--red);border:1px solid #6a3a3a}
.tag.dim{background:var(--panel2);color:var(--dim);border:1px solid var(--line)}
.pips{display:flex;gap:4px;margin:5px 0 4px}
.pip{width:22px;height:22px;border-radius:6px;border:1px solid var(--line2);background:#10131b;display:grid;place-items:center;font-size:11px;font-weight:900;color:var(--dim)}
.pip.on{color:#111}
.pip.s1.on{background:var(--green);border-color:var(--green)}
.pip.s2.on{background:var(--blue);border-color:var(--blue)}
.pip.s3.on{background:var(--gold);border-color:var(--gold)}
.pip.s4.on{background:var(--orange);border-color:var(--orange)}
.pip.s5.on{background:#ff6b6b;border-color:#ff6b6b}
.chosen{list-style:none;margin:0;padding:0;font-size:12.5px;color:var(--muted)}
.chosen li{margin:2px 0}
.chosen b{display:inline-block;min-width:17px;text-align:center;border-radius:4px;background:var(--panel2);color:var(--gold);margin-right:6px;font-size:11px}
.chosen .lv{color:var(--dim);font-size:11px;margin-right:4px}
.skl .why{font-size:12.5px;color:var(--dim);margin-top:3px}
.skl .ql{font-size:11.5px;color:var(--dim);margin-top:3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--dim);font-size:12px;padding:8px 14px;border-top:1px solid var(--line)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend .pip{width:16px;height:16px;font-size:9px}

/* build: stigma / pasif kartları */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tiles.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.tl{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 8px;text-align:center}
.tl>img{width:48px;height:48px;border-radius:9px;border:1px solid var(--line2);display:block;margin:0 auto}
.tl .pn{position:absolute;left:6px;top:6px;width:22px;height:22px;border-radius:50%;background:var(--gold);color:#1b1404;font-weight:800;font-size:12px;display:grid;place-items:center}
.tl .pto{position:absolute;right:7px;top:6px;color:var(--gold);font-weight:800;font-size:12.5px}
.tl .tn{font-weight:700;font-size:12.5px;margin-top:6px}
.tl .td{font-size:11.5px;color:var(--muted);margin-top:4px}
.tl.pvp{border-color:#6a3a3a;background:#2a1718}
.tl.pvp .pn{background:var(--red);color:#2a0606}
.sub-l{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 8px;display:flex;gap:8px;align-items:center}
.sub-l:first-child{margin-top:0}

/* build: tuş dizilimi */
.hb-wrap{overflow-x:auto}
.hb{display:grid;grid-template-columns:repeat(10,minmax(46px,1fr));gap:6px;min-width:520px;align-items:end}
.hb .col{display:flex;flex-direction:column-reverse;gap:4px;padding:4px;border-radius:8px;border:1px solid transparent}
.hb .col.mac{border-color:#5d4a1c;background:#2a2412}
.hb .k{text-align:center;font-weight:800;font-size:12px;color:var(--gold);order:-1}
.hb .cell{position:relative;aspect-ratio:1;border-radius:7px;border:1px solid var(--line);background:#10131b}
.hb .cell img{width:100%;height:100%;border-radius:6px;display:block}
.hb .cell .lv{position:absolute;right:-3px;bottom:-3px;background:#0b0d12;border:1px solid var(--line2);color:var(--text);font-size:10px;font-weight:800;border-radius:5px;padding:0 3px;line-height:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.steps{margin:0;padding-left:20px;color:var(--muted)}
.steps li{margin:5px 0}
.steps b{color:var(--text)}
.chain{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.chain img{width:36px;height:36px;border-radius:7px;border:1px solid var(--line2)}
.chain .ar{color:var(--gold);font-weight:800}

/* daevanion */
.dvtop{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.btabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.btabs button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--muted)}
.btabs button.on{border-color:var(--gold);color:var(--gold);background:#2a2412}
.btabs button small{color:var(--dim);margin-left:4px}
.btabs button .dr{color:var(--red);margin-left:4px;font-size:11px}
.dwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.dg{display:grid;gap:3px;background:#0c0f16;border:1px solid var(--line);border-radius:10px;padding:8px}
.dg .nd{position:relative;aspect-ratio:1;border-radius:6px;display:grid;place-items:center}
.dg .nd img{width:100%;height:100%;object-fit:cover;border-radius:5px;display:block}
.dg .nd.off img{opacity:.25;filter:grayscale(.7)}
.dg .nd.off .lb{opacity:.4}
.dg .nd.on{box-shadow:0 0 0 2px var(--gold),0 0 10px #e8c06a55}
.dg .nd.sk.on{box-shadow:0 0 0 2px var(--purple),0 0 10px #b48cff66}
.dg .nd.un.on{box-shadow:0 0 0 2px var(--orange),0 0 10px #ff9f5a66}
.dg .nd.keep{box-shadow:0 0 0 2px #357050}
.dg .nd.keep .no{background:var(--green);color:#06210f}
.dg .nd.drop{box-shadow:0 0 0 2px var(--red),0 0 10px #ff808066}
.dg .nd.drop img{opacity:.45}
.dg .nd.drop .no{background:var(--red);color:#2a0606}
.dg .nd.done img{opacity:.5}
.dg .nd.done .no{background:var(--green);color:#06210f}
.dg .lb{position:absolute;left:0;right:0;bottom:1px;text-align:center;font-size:9px;font-weight:800;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000;pointer-events:none}
.dg .no{position:absolute;top:-5px;left:-5px;min-width:17px;height:17px;padding:0 3px;border-radius:9px;background:var(--gold);color:#1b1404;font-size:10px;font-weight:900;display:grid;place-items:center;z-index:1}
.dg .nd.sk .no{background:var(--purple);color:#14092a}
.dg .nd.un .no{background:var(--orange)}
.dg .nd.hl{animation:hl 1s ease-in-out infinite alternate;z-index:2}
@keyframes hl{from{box-shadow:0 0 0 2px #fff,0 0 4px #fff8}to{box-shadow:0 0 0 3px #fff,0 0 16px #fffc}}
.dlegend{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:12px;margin-top:10px}
.dlegend b{color:var(--text)}
.ptsrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ptsrow input{width:96px;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;color:var(--text);font:inherit;font-weight:700;padding:5px 10px}
.ptsrow span{color:var(--dim);font-size:12px}
.steps2{list-style:none;margin:0;padding:0;max-height:620px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.steps2 li{display:grid;grid-template-columns:26px 28px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 10px;border-top:1px solid var(--line);font-size:12.5px;cursor:pointer}
.steps2 li:first-child{border-top:0}
.steps2 li.hd{display:block;background:#0f1219;color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;cursor:default}
.steps2 li.drop{background:#2a1416;cursor:default}
.steps2 li.drop .n{color:var(--red)}
.steps2 li.done{opacity:.5}
.steps2 li.done .n{color:var(--green)}
.steps2 li.next{outline:2px solid var(--green);outline-offset:-2px}
.steps2 li.sel{outline:2px solid var(--gold);outline-offset:-2px}
.steps2 .n{font-weight:900;color:var(--gold);text-align:right}
.steps2 img{width:28px;height:28px;border-radius:5px}
.steps2 .b{color:var(--dim);font-size:11px}
.steps2 .c{color:var(--dim);font-size:11px;text-align:right;white-space:nowrap}
.steps2 li.sk{background:#1c1730}
.steps2 li.un{background:#2a1d12}
.prio3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.prio3>div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px;color:var(--muted)}
.prio3 .h{font-weight:800;color:var(--text);margin-bottom:4px}
.prio3 .icons{display:flex;gap:4px}
.prio3 img{width:28px;height:28px;border-radius:5px;border:1px solid var(--line2)}

/* arcana, genus, pantheon, taş, ekipman */
.arc{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.ac{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px}
.ac.vig{border-color:#5d4a1c;background:#2a2412}
.ac .h{font-weight:800}
.ac .t{font-size:11.5px;color:var(--dim);margin-bottom:6px}
.ac .ss{display:flex;flex-direction:column;gap:4px}
.ac .s{display:grid;grid-template-columns:26px 1fr auto;gap:6px;align-items:center;font-size:12px}
.ac .s img{width:26px;height:26px;border-radius:5px}
.ac .s b{color:var(--gold);font-size:11.5px}
.ac .s.empty{color:var(--dim)}
.ac .alt{margin-top:8px;padding-top:6px;border-top:1px dashed var(--line2);font-size:11.5px;color:var(--dim)}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
table.tb th,table.tb td{text-align:left;padding:7px 10px;border-top:1px solid var(--line);vertical-align:top}
table.tb th{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.05em;border-top:0;white-space:nowrap}
table.tb td{color:var(--muted)}
table.tb td:first-child{font-weight:700;color:var(--text);white-space:nowrap}
table.tb td.hi{color:var(--gold);font-weight:700}
.tbw{overflow-x:auto}
.ord{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ord span{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12.5px}
.ord span b{color:var(--gold);margin-right:4px}
.ord .ar{background:none;border:0;padding:0;color:var(--gold);font-weight:800}
.pan{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pan>div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px}
.pan .v{font-size:12px;color:var(--gold);font-weight:800}
.pan .h{font-weight:800;margin:2px 0}
.pan .d{font-size:12.5px;color:var(--muted)}
.cmp2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp2>div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.cmp2 .h{font-weight:800;margin-bottom:4px}
.cmp2 ul{margin:0;padding-left:18px;color:var(--muted);font-size:12.5px}
.cmp2 li{margin:2px 0}
.cmp2 .new{color:var(--green)}
.eqsel{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.eqsel button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--muted);text-align:left}
.eqsel button b{display:block;color:var(--text);font-size:13px}
.eqsel button small{color:var(--dim)}
.eqsel button.on{border-color:var(--gold);background:#2a2412}
.eqsel button.on b{color:var(--gold)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chips span{font-size:11.5px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted)}

/* 45+ yol haritası */
.gs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.gs .s{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;position:relative}
.gs .s .v{font-size:22px;font-weight:800;color:var(--gold);line-height:1.1}
.gs .s .v small{font-size:11px;color:var(--dim);font-weight:600;margin-left:3px}
.gs .s ul{margin:6px 0 0;padding:0;list-style:none;font-size:12.5px;color:var(--muted)}
.gs .s li{margin:2px 0}
.gs .s.now{border-color:var(--gold);background:#2a2412}
.gs .s.now:before{content:"ŞİMDİKİ HEDEF";display:inline-block;margin-bottom:4px;font-size:9.5px;font-weight:800;color:#1b1404;background:var(--gold);border-radius:4px;padding:1px 5px}
.road{list-style:none;margin:0;padding:0}
.road>li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.road>li:first-child{border-top:0}
.road .n{width:30px;height:30px;border-radius:50%;background:var(--gold);color:#1b1404;font-weight:800;display:grid;place-items:center}
.road .h{font-weight:700;font-size:14.5px}
.road .h kbd{margin-left:6px}
.road .g{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.road .g span{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--greenbg);color:var(--green);border:1px solid #245c3c}
.road .d{color:var(--muted);font-size:13px}
.road .d b{color:var(--text)}
.rt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.rt .c{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.rt .c .h{font-weight:800;margin-bottom:6px}
.rt .c ul{margin:0;padding-left:18px;color:var(--muted);font-size:12.5px}
.rt .c li{margin:3px 0}
.rt .c b{color:var(--text)}
.donts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.donts div{background:#2a1718;border:1px solid #6a3a3a;border-radius:10px;padding:10px 12px;color:var(--muted);font-size:12.5px}
.donts div b{color:var(--red);display:block;margin-bottom:3px;font-size:13px}
.donts.ok div{background:var(--greenbg);border-color:#245c3c}
.donts.ok div b{color:var(--green)}

/* levo: görsel build sayfası */
.vbtn{display:inline-flex;align-items:center;gap:4px;background:#2d2614;border:1px solid #5d4a1c;color:#e8c06a;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700;text-decoration:none;white-space:nowrap}
.vbtn:hover{background:#5d4a1c;color:#fff}
.lvpage{--lgold:#e8c06a;--lgold2:#f4dda2;--lline:#303849;--lline2:#3e4860;--lcard:#141925;--lcard2:#0f131c;--lteal:#72ddb9;--lblue:#82b5ff;--lred:#ff8f8f;--lorange:#ffae6b}
.lvpage .lvcard{background:linear-gradient(180deg,#161b27,#11151e);border:1px solid var(--lline);border-radius:14px;margin-bottom:16px;scroll-margin-top:58px;overflow:hidden}
.lvpage .lvhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--lline);background:linear-gradient(180deg,#1a2030,#141925)}
.lvhead .lvk{display:block;font-size:10px;font-weight:900;letter-spacing:.16em;color:var(--lgold);text-transform:uppercase}

.arcgal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;padding:14px 16px 4px}

.gtabs{display:flex;gap:7px;flex-wrap:wrap;padding:12px 16px 0}

.gboard{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;max-width:560px;margin:0 auto}

.glegend{display:flex;gap:7px 14px;flex-wrap:wrap;margin-top:10px;color:#8e97ad;font-size:10.5px}

.rotstep .n{font-size:11.5px;font-weight:800;line-height:1.2}
.rotstep .d{font-size:10px;color:#8e97ad;line-height:1.3}

.rotstep.last{border-color:#2e5c4b}
.rotar{align-self:center;color:var(--lgold);font-weight:900;font-size:16px}
.rotnote{padding:0 16px 14px;color:#8e97ad;font-size:12px}
.rotnote b{color:#e7e9ef}

/* alt accordions */
.lvdetails{padding:0 16px 14px}

.lvacc[open]>summary:after{content:"–"}

.lvcols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.lvcols ol{margin:0;padding-left:18px}
.lvcols li{margin:4px 0}
.lvdonts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}

// Daevanion: questlog'daki iki plan; adımlar gen_dv.py ile öncelik sırasına göre (her hedefe en ucuz yol)
const DV_IMG = {11: "Common", 21: "Rare", 31: "Legend", 41: "Unique"};
function dvNode(n) {
  if (n.t === "start") return {img: "icons/dv/Start.webp", lb: "", name: "Başlangıç", cls: "st"};
  if (n.t === "skill") return {img: SK[n.skill].icon, lb: "+1", name: n.name, cls: "sk"};
  return {img: "icons/dv/" + (DV_IMG[n.g] || "Common") + ".webp", lb: n.lb, name: n.name, cls: n.g >= 41 ? "un" : "st"};
}
function dvView() {
  const boards = DVJ.boards.filter(b => dvMode === "az" ? b.cur === "battle" : b.cur === "daevanion");
  const steps = dvMode === "315" ? DVJ.p315 : dvMode === "386" ? DVJ.p386 : DVJ.azphel;
  const cost = {}, nodeOf = {};
  DVJ.boards.forEach(b => b.nodes.forEach(n => { cost[n.id] = n.cost; nodeOf[n.id] = [b, n]; }));
  const drop = new Set(dvMode === "386" ? DVJ.drop : []);
  const keep = new Set();
  if (dvMode === "386") DVJ.p315.forEach(s => s.ids.forEach(id => { if (!drop.has(id)) keep.add(id); }));
  let cum = [...keep].reduce((a, id) => a + cost[id], 0);
  const base = cum, stepOf = {}, list = steps.map((s, i) => {
    const c = s.ids.reduce((a, id) => a + cost[id], 0); cum += c;
    s.ids.forEach(id => stepOf[id] = i);
    const [b, t] = nodeOf[s.ids[s.ids.length - 1]];
    return {i, b: b.id, ids: s.ids, cost: c, cum, target: t};
  });
  return {boards, list, base, total: cum, keep, drop, stepOf, cost};
}
function renderDv() {
  const el = $("dvbody"); if (!el || !DVJ) return;
  document.querySelectorAll("#dvseg button").forEach(b => b.classList.toggle("on", b.dataset.dvmode === dvMode));
  const V = dvView(), pts = dvPts[dvMode] || 0;
  if (dvBoard >= V.boards.length) dvBoard = 0;
  const b = V.boards[dvBoard];
  const done = i => V.list[i].cum <= pts;
  const next = V.list.findIndex(s => s.cum > pts);
  const selIds = new Set(dvSel != null && V.list[dvSel] ? V.list[dvSel].ids : []);
  const map = {}; b.nodes.forEach(n => map[n.r + "-" + n.c] = n);
  const R0 = Math.min(...b.nodes.map(n => n.r)), R1 = Math.max(...b.nodes.map(n => n.r));
  const C0 = Math.min(...b.nodes.map(n => n.c)), C1 = Math.max(...b.nodes.map(n => n.c));
  let cells = "";
  for (let r = R0; r <= R1; r++) for (let c = C0; c <= C1; c++) {
    const n = map[r + "-" + c];
    if (!n) { cells += "<div></div>"; continue; }
    const f = dvNode(n), si = V.stepOf[n.id];
    let st = "off", badge = "";
    if (n.t === "start") st = "on";
    else if (V.drop.has(n.id)) { st = "on drop"; badge = "✕"; }
    else if (V.keep.has(n.id)) { st = "on keep"; badge = "✓"; }
    else if (si != null) { st = "on" + (done(si) ? " done" : ""); badge = si + 1; }
    cells += `<div class="nd ${f.cls} ${st}${selIds.has(n.id) ? " hl" : ""}" title="${f.name}${n.cost ? " · " + n.cost + " puan" : ""}${si != null ? " · adım " + (si + 1) : ""}"${si != null ? ` data-dvstep="${si}"` : ""}>
      <img src="${f.img}" alt="">${f.lb ? `<span class="lb">${f.lb}</span>` : ""}${badge !== "" ? `<span class="no">${badge}</span>` : ""}</div>`;
  }
  const bName = id => DVJ.boards.find(x => x.id === id).name;
  let rows = "";
  if (dvMode === "386") {
    const per = {}; DVJ.drop.forEach(id => { const bb = DVJ.boards.find(x => x.nodes.some(n => n.id === id)); per[bb.name] = (per[bb.name] || 0) + 1; });
    const dp = DVJ.drop.reduce((a, id) => a + V.cost[id], 0);
    rows += `<li class="hd">1 · 315'ten geri al: ${DVJ.drop.length} düğüm, ${dp} puan geri gelir</li><li class="drop"><span class="n">✕</span><span></span><span>${Object.entries(per).map(([k, v]) => `${k} ${v}`).join(" · ")}<div class="b">Tahtada kırmızı ✕ olanlar. Yeşil ✓ olanlar (${V.base} puan) kalıyor.</div></span><span class="c"></span></li>`;
    rows += `<li class="hd">2 · Sırayla ekle</li>`;
  }
  rows += V.list.map(s => {
    const f = dvNode(s.target);
    return `<li class="${f.cls} ${done(s.i) ? "done" : ""} ${s.i === next ? "next" : ""} ${s.i === dvSel ? "sel" : ""}" data-dvstep="${s.i}"><span class="n">${done(s.i) ? "✓" : s.i + 1}</span><img src="${f.img}" alt="">
      <span>${f.name}<div class="b">${bName(s.b)} · ${s.ids.length} düğüm</div></span><span class="c">+${s.cost} p<br>${s.cum}</span></li>`;
  }).join("");
  const label = dvMode === "az" ? "Azphel puanın (battle crystal)" : "Daevanion puanın";
  const info = dvMode === "315" ? "Nezekan, Zikel, Vaizel, Triniel · leveling bitince elindeki puan."
    : dvMode === "386" ? "315'ten sonra: 350 Daevanion + 36 Azphel. Mour4SB'nin şu anki planı."
    : "Azphel 45'te açılır, PvP tahtası; ayrı para birimi (battle crystal). 386 planındaki 36 puanlık kısım.";
  const bp = bb => V.list.filter(s => s.b === bb.id).reduce((a, s) => a + s.cost, 0);
  el.innerHTML = `
    <div class="dvtop"><div class="ptsrow"><span>${label}:</span><input id="dvpts" type="number" min="0" inputmode="numeric" value="${pts || ""}" placeholder="0"><span>toplam ${V.total} · ${next < 0 ? "plan tamam" : "sıradaki adım " + (next + 1)}</span></div></div>
    <div class="muted" style="font-size:12.5px;margin:-4px 0 10px">${info}</div>
    <div class="btabs">${V.boards.map((x, i) => {
      const dr = dvMode === "386" ? DVJ.drop.filter(id => x.nodes.some(n => n.id === id)).length : 0;
      return `<button data-dvboard="${i}" class="${i === dvBoard ? "on" : ""}">${x.name}<small>Lv ${x.need} · ${dvMode === "386" ? "+" : ""}${bp(x)} p</small>${dr ? `<span class="dr">✕${dr}</span>` : ""}</button>`;
    }).join("")}</div>
    <div class="dwrap">
      <div>
        <div class="dg" style="grid-template-columns:repeat(${C1 - C0 + 1},1fr)">${cells}</div>
        <div class="dlegend">
          <span><b>Numara</b> = adım (sağdaki liste)</span>
          ${dvMode === "386" ? `<span><b style="color:var(--green)">✓</b> 315'ten kalıyor</span><span><b style="color:var(--red)">✕</b> geri al</span>` : ""}
          <span><b style="color:var(--purple)">Mor</b> skill +1</span><span><b style="color:var(--orange)">Turuncu</b> büyük stat</span>
          <span>SLD saldırı · KRT kritik · KDİ kritik direnci · SVN savunma · HIZ savaş hızı · HSR hasar artışı · KHA kritik hasar · ÇVR multi-hit · CD cooldown · DEŞ/DED durum etkisi şansı/direnci${dvMode === "az" ? " · P… = PvP statları" : ""}</span>
        </div>
      </div>
      <ol class="steps2">${rows}</ol>
    </div>`;
}

function applyLvMode(after) {
  document.querySelectorAll("#lv .skcard[data-sk]").forEach(card => {
    const s = LEVO_SK.find(x => x.id === card.dataset.sk);
    if (!s) return;
    const picks = after ? s.picks16 : s.picks;
    card.querySelectorAll(".specnode").forEach(node => {
      const slot = +node.dataset.slot;
      const on = picks.includes(slot);
      const isNew = after && slot === 5 && !s.skip16 && on;
      const future = !after && slot === 5 && !s.skip16;
      node.classList.toggle("on", on);
      node.classList.toggle("new", isNew);
      node.classList.toggle("future", future);
      const badge = node.querySelector(".snnew");
      if (badge) badge.textContent = future ? "16'DA" : isNew ? "YENİ" : "";
    });
    const bar = card.querySelector(".skbar");
    if (bar) {
      const b = bar.querySelector("b");
      const spans = bar.querySelectorAll("span");
      if (b) b.textContent = after ? "16 sonrası" : "16 öncesi";
      if (spans[0]) spans[0].textContent = after && !s.skip16 ? "3 yuva" : "2 yuva";
    }
  });
}

function bindLvEvents() {
  if ($("lv").dataset.bound) return;
  $("lv").dataset.bound = "1";
  $("lv").addEventListener("click", e => {
    const sg = e.target.closest("#lvSeg button");
    if (sg) {
      const after = sg.dataset.s16 === "1";
      lvSaveUz(after);
      $("lvSeg").querySelectorAll("button").forEach(b => b.classList.toggle("on", b === sg));
      applyLvMode(after);
      return;
    }
    const bd = e.target.closest(".lbrd");
    if (bd) {
      lvSaveBoard(bd.dataset.lvbrd);
      document.querySelectorAll("#lv .lbrd").forEach(b => b.classList.toggle("on", b === bd));
      document.querySelectorAll("#lv .lgbp").forEach(p => p.classList.toggle("on", p.dataset.gb === bd.dataset.lvbrd));
    }
  });
}

function bossHidden() { try { return JSON.parse(localStorage.getItem("aion2BossHidden") || "{}"); } catch (e) { return {}; } }
function saveBossHidden(o) { try { localStorage.setItem("aion2BossHidden", JSON.stringify(o)); } catch (e) {} }
function bossFav() { try { return JSON.parse(localStorage.getItem("aion2BossFav") || "{}"); } catch (e) { return {}; } }
function saveBossFav(o) { try { localStorage.setItem("aion2BossFav", JSON.stringify(o)); } catch (e) {} }

// ---------- Global sayaç (Cloudflare Worker + Discord bot) ----------
// Deploy sonrası worker URL'sini buraya yaz: "https://aion2-boss-timer.xxxx.workers.dev"
const BOSS_API = "https://aion2-boss-timer.aion2-boss-timer.workers.dev";
// İsteğe bağlı Discord davet linki: "https://discord.gg/xxxx"
const BOSS_DISCORD_INVITE = "";
const BOSS_GLOBAL_POLL_MS = 30000;
let bossGlobal = null;

function bossGlobalConfigured() { return /^https?:\/\//i.test(BOSS_API); }
function bossGlobalFor(id) {
  return bossGlobal && bossGlobal.bosses && Object.prototype.hasOwnProperty.call(bossGlobal.bosses, id)
    ? bossGlobal.bosses[id] : null;
}
function bossIsGlobal(id) { return !!bossGlobalFor(id); }
function bossGlobalUnknown(id) {
  const g = bossGlobalFor(id);
  return !!(g && !(Number(g.until) || 0));
}
function formatRelativeTime(ts) {
  const diff = Date.now() - ts;
  if (diff < 45000) return "az önce";
  const m = Math.floor(diff / 60000);
  if (m < 60) return m + " dk önce";
  const h = Math.floor(m / 60);
  if (h < 24) return h + " sa önce";
  return Math.floor(h / 24) + " gün önce";
}
function updateBossGlobalBar() {
  const bar = document.querySelector("[data-bossglobal]");
  if (!bar) return;
  bar.className = "boss-globalbar";
  if (!bossGlobalConfigured()) {
    bar.innerHTML = `<span class="boss-global-dot"></span><span><b>Yerel mod</b> · işaretlemeler sadece bu tarayıcıda saklanır.</span>`;
    return;
  }
  if (!bossGlobal || bossGlobal.status === "loading") {
    bar.innerHTML = `<span class="boss-global-dot"></span><span><b>Global sayaç</b> · bağlanıyor…</span>`;
    return;
  }
  if (bossGlobal.status === "error") {
    bar.className = "boss-globalbar err";
    bar.innerHTML = `<span class="boss-global-dot"></span><span><b>Global sayaç kapalı</b> · ${escHtml(bossGlobal.error || "API'ye ulaşılamadı")}. Yerel kayıt veya son bilinen süreler gösteriliyor.</span>`;
    return;
  }
  const last = bossGlobal.updatedAt ? formatRelativeTime(bossGlobal.updatedAt) : "henüz güncellenmedi";
  bar.innerHTML = `<span class="boss-global-dot"></span><span><b>Global sayaç</b> · Discord'dan güncellenir · son değişiklik: <span data-bossglobaltime>${escHtml(last)}</span></span>`;
}
async function loadBossGlobal(force) {
  if (!bossGlobalConfigured()) return;
  if (bossGlobal && bossGlobal.inFlight) return;
  const now = Date.now();
  if (!force && bossGlobal && now - (bossGlobal.lastFetch || 0) < BOSS_GLOBAL_POLL_MS - 5000) return;
  if (!bossGlobal) bossGlobal = { bosses: {}, updatedAt: 0, status: "loading", lastFetch: 0, error: "", sig: "", inFlight: false };
  bossGlobal.lastFetch = now;
  bossGlobal.inFlight = true;
  try {
    const bust = force ? "?fresh=1&t=" + Date.now() : "";
    const res = await fetch(BOSS_API.replace(/\/+$/, "") + "/api/timers" + bust);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if (!data || data.ok === false) throw new Error("API hatası");
    const bosses = {};
    (data.bosses || []).forEach(b => { if (b && b.id) bosses[b.id] = b; });
    const sig = JSON.stringify(Object.keys(bosses).sort().map(k => [k, bosses[k].until || 0]));
    const changed = sig !== bossGlobal.sig;
    bossGlobal.bosses = bosses;
    bossGlobal.order = (data.bosses || []).map(b => b && b.id).filter(Boolean);
    bossGlobal.updatedAt = Number(data.updatedAt) || 0;
    bossGlobal.status = "ok";
    bossGlobal.error = "";
    bossGlobal.sig = sig;
    if (changed && tab === "boss") renderBoss();
    else updateBossGlobalBar();
  } catch (err) {
    bossGlobal.status = "error";
    bossGlobal.error = err && err.message ? err.message : "bağlantı hatası";
    updateBossGlobalBar();
  } finally {
    bossGlobal.inFlight = false;
  }
}

function allBosses() {
  const names = bossNames();
  const hidden = bossHidden();
  const fav = bossFav();
  return BOSS_DEFAULTS.map(b => {
    const o = { id: b.name, name: b.name, map: b.map, min: b.min, lvl: b.lvl || 0, manualOnly: !!b.manualOnly, custom: false };
    o.displayName = names[o.id] || o.name;
    o.hidden = !!hidden[o.id];
    o.favorite = fav[o.id] === true || (b.fav === true && fav[o.id] !== false);
    return o;
  }).concat(customBosses().map(b => {
    const o = { id: b.id, name: b.name, map: b.map, min: b.min, lvl: b.lvl || 0, manualOnly: !!b.manualOnly, custom: true };
    o.displayName = names[o.id] || o.name;
    o.hidden = !!hidden[o.id];
    o.favorite = fav[o.id] === true || (b.fav === true && fav[o.id] !== false);
    return o;
  }));
}
function bossUntil(b) {
  const g = bossGlobalFor(b.id);
  if (g) return Number(g.until) || 0;
  const v = bossState()[b.id];
  if (v == null) return 0;
  if (typeof v === "number") return v + (b.min || 0) * 60 * 1000;
  if (typeof v === "object" && v.until) return v.until;
  return 0;
}
function bossRemainingMs(b) {
  const until = bossUntil(b);
  if (!until) return 0;
  const rem = until - Date.now();
  return rem > 0 ? rem : 0;
}
function parseMinutesInput(str) {
  const s = String(str).trim().toLowerCase();
  let m = s.match(/(\d+)\s*[:.]\s*(\d+)/);
  if (m) return parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
  const h = s.match(/(\d+)\s*(s|sa|saat|h|hr|hour)/);
  const mm = s.match(/(\d+)\s*(dk|dakika|m|min|minute)/);
  if (h || mm) return (h ? parseInt(h[1], 10) * 60 : 0) + (mm ? parseInt(mm[1], 10) : 0);
  const parts = s.split(/\s+/).filter(Boolean);
  if (parts.length === 2 && /^\d+$/.test(parts[0]) && /^\d+$/.test(parts[1])) return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
  const n = parseInt(s, 10);
  return isNaN(n) ? null : n;
}
function formatHMmin(ms) {
  const mins = Math.ceil(ms / 60000);
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  if (h > 0) return h + ":" + String(m).padStart(2, "0");
  return String(m);
}
function bossGlobalGuard(id) {
  if (!bossIsGlobal(id)) return false;
  alert("Bu boss global sayaçtan yönetiliyor. Discord'da /kes veya /sure komutunu kullan.");
  return true;
}
function setBossRemaining(id) {
  if (bossGlobalGuard(id)) return;
  const b = allBosses().find(x => x.id === id);
  const cur = b ? bossRemainingMs(b) : 0;
  const def = cur > 0 ? formatHMmin(cur) : (b && b.min ? formatHMmin(b.min * 60000) : "30");
  const input = prompt("Kalan süre gir (örn: 4:15 veya 255):", def);
  if (input === null) return;
  const mins = parseMinutesInput(input);
  if (!mins || mins < 1) return;
  const s = bossState(); s[id] = { until: Date.now() + mins * 60 * 1000 }; saveBossState(s); renderBoss();
}
function renameBoss(id) {
  const b = allBosses().find(x => x.id === id);
  const cur = b ? (b.displayName || b.name) : id;
  const input = prompt("Boss adı (oyun içi isim):", cur);
  if (input === null) return;
  const v = input.trim();
  const o = bossNames();
  if (v && v !== b.name) o[id] = v; else delete o[id];
  saveBossNames(o);
  renderBoss();
}
function hideBoss(id, hide) {
  const o = bossHidden();
  if (hide) o[id] = true; else delete o[id];
  saveBossHidden(o);
  renderBoss();
}
function toggleFavorite(id) {
  const b = allBosses().find(x => x.id === id);
  const cur = b ? !!b.favorite : false;
  const o = bossFav();
  if (cur) o[id] = false; else { o[id] = true; const h = bossHidden(); delete h[id]; saveBossHidden(h); }
  saveBossFav(o);
  renderBoss();
}
function formatMs(ms) {
  const s = Math.ceil(ms / 1000);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  if (h > 0) return h + ":" + String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0");
  return m + ":" + String(sec).padStart(2, "0");
}
function escHtml(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function escAttr(s) { return escHtml(s).replace(/"/g, "&quot;"); }
function markBoss(id) {
  if (bossGlobalGuard(id)) return;
  const s = bossState(); s[id] = Date.now(); saveBossState(s); renderBoss();
}
function clearBoss(id) {
  if (bossGlobalGuard(id)) return;
  const s = bossState(); delete s[id]; saveBossState(s); renderBoss();
}
function clearAllBosses() {
  const msg = bossGlobalConfigured()
    ? "Sadece bu tarayıcıdaki yerel işaretler silinsin mi? Global sayaç etkilenmez."
    : "Tüm boss işaretleri sıfırlansın mı?";
  if (!confirm(msg)) return;
  saveBossState({}); renderBoss();
}
function addBoss() {
  const nameEl = $("bossNewName"), mapEl = $("bossNewMap"), minEl = $("bossNewMin");
  const name = (nameEl.value || "").trim();
  const map = (mapEl.value || "").trim() || "Özel";
  const min = parseInt(minEl.value, 10);
  if (!name || !min || min < 1) return;
  const custom = customBosses();
  let id = name;
  if (allBosses().some(b => b.id === id)) id = name + " (" + Date.now() + ")";
  custom.push({ id, name, map, min });
  saveCustomBosses(custom);
  nameEl.value = ""; mapEl.value = ""; minEl.value = "";
  renderBoss();
}
function renderBoss() {
  const bosses = allBosses();
  const maps = [...new Set(bosses.map(b => b.map))].sort((a, b) => a.localeCompare(b, "tr"));
  const filtered = bosses.filter(b => {
    if (bossMapFilter !== "all" && b.map !== bossMapFilter) return false;
    if (bossFaction === "elyos" && b.map === "Altgard") return false;
    if (bossFaction === "asmodian" && b.map === "Verteron") return false;
    if (bossLevelFilter === "high" && !b.custom && (b.lvl || 0) < 48) return false;
    if (!bossShowHidden && b.hidden && !b.favorite) return false;
    if (bossFavOnly && !b.favorite) return false;
    if (bossQuery) {
      const q = bossQuery.toLowerCase();
      const nm = (b.displayName || b.name).toLowerCase();
      if (!nm.includes(q) && !b.map.toLowerCase().includes(q)) return false;
    }
    return true;
  });
  // Global bosslar botun belirlediği sırayla en üstte durur.
  const globalOrder = (bossGlobal && bossGlobal.order) || [];
  const globalRank = b => { const i = globalOrder.indexOf(b.id); return i === -1 ? Infinity : i; };
  filtered.sort((a, b) => {
    const ga = globalRank(a), gb = globalRank(b);
    if (ga !== gb) return ga - gb;
    const ra = bossRemainingMs(a), rb = bossRemainingMs(b);
    if (ra > 0 && rb === 0) return -1;
    if (rb > 0 && ra === 0) return 1;
    if (ra > 0 && rb > 0) return ra - rb;
    return a.name.localeCompare(b.name, "tr");
  });
  const state = bossState();
  const rows = filtered.map(b => {
    const g = bossGlobalFor(b.id);
    const gUntil = g ? (Number(g.until) || 0) : 0;
    const unknown = !!(g && !gUntil);
    const rem = bossRemainingMs(b);
    const ready = !unknown && rem <= 0;
    const cdText = unknown ? "Bilinmiyor" : (ready ? "Hazır" : formatMs(rem));
    const cdClass = unknown ? "boss-unknown" : (ready ? "boss-ready" : "boss-busy");
    const respawnMin = g && Number(g.respawnMin) ? Number(g.respawnMin) : b.min;
    const respawnTxt = b.manualOnly ? "Manuel" : (respawnMin >= 60 ? (Math.floor(respawnMin / 60) + (respawnMin % 60 ? " sa " + (respawnMin % 60) + " dk" : " sa")) : (respawnMin + " dk"));
    const lvlTxt = b.lvl ? ` · Lv ${b.lvl}` : "";
    const shownName = b.displayName || b.name;
    const globalBadge = g ? ' <span class="boss-global-badge" title="Discord botundan güncellenir">GLOBAL</span>' : "";
    const srcTxt = g && gUntil && g.updatedBy ? ` · son: ${escHtml(g.updatedBy)}` : "";
    const actions = g
      ? `${BOSS_DISCORD_INVITE
            ? `<a class="boss-discord" href="${escAttr(BOSS_DISCORD_INVITE)}" target="_blank" rel="noopener">Discord'dan güncelle</a>`
            : `<span class="boss-discord">Discord'dan güncelle</span>`}
         <button data-bossact="fav" data-bid="${escAttr(b.id)}">${b.favorite ? "★ Önemli" : "☆ Önemli"}</button>
         <button data-bossact="hide" data-bid="${escAttr(b.id)}">${b.hidden ? "Göster" : "Gizle"}</button>`
      : `${b.manualOnly ? "" : `<button class="mark" data-bossact="mark" data-bid="${escAttr(b.id)}">Öldürdüm</button>`}
         <button data-bossact="settime" data-bid="${escAttr(b.id)}">Süre ayarla</button>
         <button data-bossact="fav" data-bid="${escAttr(b.id)}">${b.favorite ? "★ Önemli" : "☆ Önemli"}</button>
         <button data-bossact="rename" data-bid="${escAttr(b.id)}">Adı değiştir</button>
         <button data-bossact="hide" data-bid="${escAttr(b.id)}">${b.hidden ? "Göster" : "Gizle"}</button>
         ${state[b.id] ? `<button data-bossact="clear" data-bid="${escAttr(b.id)}">Sıfırla</button>` : ""}`;
    return `<tr data-bossrow="${escAttr(b.id)}" ${b.hidden ? 'style="opacity:.45"' : ""}>
      <td><div class="bossname">${b.favorite ? "★ " : ""}${escHtml(shownName)}${globalBadge}${b.hidden ? ' <span style="color:var(--red);font-size:11px">(gizli)</span>' : ""}</div><div class="bossmap">${escHtml(b.map)}${lvlTxt}${srcTxt}</div></td>
      <td>${respawnTxt}</td>
      <td><span class="boss-cd ${cdClass}" data-bid="${escAttr(b.id)}">${cdText}</span><span class="boss-at" data-bossat="${escAttr(b.id)}">${(!unknown && !ready) ? bossAtText(rem) : ""}</span></td>
      <td class="boss-actions">${actions}</td>
    </tr>`;
  }).join("");
  $("boss").innerHTML = `
    <div class="card">
      <h2>Boss sayacı <span class="r">${bossGlobalConfigured() ? "Discord'dan güncelle · otomatik geri sayım" : "Manuel işaretle · otomatik geri sayım"}</span></h2>
      <div class="pad">
        <div class="boss-globalbar" data-bossglobal></div>
        <div class="boss-tools">
          <input id="bossSearch" type="search" placeholder="Boss veya harita ara…" value="${escAttr(bossQuery)}">
          <button data-bossmap="all" class="${bossMapFilter === "all" ? "on" : ""}">Tümü</button>
          ${maps.map(m => `<button data-bossmap="${escAttr(m)}" class="${bossMapFilter === m ? "on" : ""}">${escHtml(m)}</button>`).join("")}
        </div>
        <div class="boss-tools" style="margin-top:-6px">
          <span style="color:var(--muted);font-size:12px">Irkm:</span>
          <button data-bossfaction="elyos" class="${bossFaction === "elyos" ? "on" : ""}">Elyos (Verteron)</button>
          <button data-bossfaction="asmodian" class="${bossFaction === "asmodian" ? "on" : ""}">Asmodian (Altgard)</button>
          <button data-bossfaction="all" class="${bossFaction === "all" ? "on" : ""}">Hepsi</button>
        </div>
        <div class="boss-tools" style="margin-top:-6px">
          <span style="color:var(--muted);font-size:12px">Seviye:</span>
          <button data-bosslvl="high" class="${bossLevelFilter === "high" ? "on" : ""}">46+ item</button>
          <button data-bosslvl="all" class="${bossLevelFilter === "all" ? "on" : ""}">Tüm boss'lar</button>
          <button data-bossshowhidden="1" class="${bossShowHidden ? "on" : ""}">Gizlenenleri göster</button>
          <button data-bossfavonly="1" class="${bossFavOnly ? "on" : ""}">Sadece önemli</button>
        </div>
        <table class="bosstable">
          <thead><tr><th>Boss</th><th>Yeniden doğma</th><th>Durum</th><th></th></tr></thead>
          <tbody>${rows || `<tr><td colspan="4" style="color:var(--muted)">Sonuç yok.</td></tr>`}</tbody>
        </table>
        <div style="margin-top:12px;color:var(--muted);font-size:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          <span>${bossGlobalConfigured() ? "Global takip edilen bosslar Discord'dan güncellenir; diğer işaretlemeler bu tarayıcıda saklanır." : "İşaretleme tarayıcıda saklanır (localStorage). Sayfa kapansa da sayaç kaldığı yerden devam eder."}</span>
          <button data-bossact="clearall" style="background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 8px;cursor:pointer;color:var(--muted);font-size:12px">${bossGlobalConfigured() ? "Yerel işaretleri sıfırla" : "Tümünü sıfırla"}</button>
        </div>
        <details style="margin-top:10px">
          <summary>Boss ekle</summary>
          <div class="pad" style="display:flex;gap:8px;flex-wrap:wrap">
            <input id="bossNewName" placeholder="Boss adı">
            <input id="bossNewMap" placeholder="Harita">
            <input id="bossNewMin" type="number" min="1" placeholder="Dk" style="width:80px">
            <button id="bossAddBtn">Ekle</button>
          </div>
        </details>
      </div>
    </div>`;
  updateBossGlobalBar();
}
// Kalan sürenin denk geldiği saat: "≈ 18:04", gün değişiyorsa "yarın 02:10".
function bossAtText(rem) {
  const at = new Date(Date.now() + rem);
  const hm = String(at.getHours()).padStart(2, "0") + ":" + String(at.getMinutes()).padStart(2, "0");
  return (at.toDateString() !== new Date().toDateString() ? "yarın " : "≈ ") + hm;
}
function tickBoss() {
  document.querySelectorAll(".boss-cd").forEach(el => {
    const id = el.dataset.bid;
    const b = allBosses().find(x => x.id === id);
    if (!b) return;
    const unknown = bossGlobalUnknown(id);
    const rem = bossRemainingMs(b);
    const ready = !unknown && rem <= 0;
    el.textContent = unknown ? "Bilinmiyor" : (ready ? "Hazır" : formatMs(rem));
    el.classList.toggle("boss-ready", !unknown && ready);
    el.classList.toggle("boss-busy", !unknown && !ready);
    el.classList.toggle("boss-unknown", unknown);
    const atEl = el.parentNode.querySelector(".boss-at");
    if (atEl) {
      const txt = (!unknown && !ready) ? bossAtText(rem) : "";
      if (atEl.textContent !== txt) atEl.textContent = txt;
    }
  });
  const barTime = document.querySelector("[data-bossglobaltime]");
  if (barTime && bossGlobal && bossGlobal.updatedAt) {
    const txt = formatRelativeTime(bossGlobal.updatedAt);
    if (barTime.textContent !== txt) barTime.textContent = txt;
  }
}

function render() {
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  ["mb", "g", "jb", "lv", "boss"].forEach(k => $(k).hidden = tab !== k);
  if (tab === "mb") renderMb();
  else if (tab === "g") renderG();
  else if (tab === "jb") renderJb();
  else if (tab === "lv") { renderLv(); bindLvEvents(); }
  else renderBoss();
}

document.addEventListener("click", e => {
  const mm = e.target.closest("[data-mbmode]");
  if (mm) { mbMode = mm.dataset.mbmode; saveMb(); renderMbSkills(); return; }
  const dm = e.target.closest("[data-dvmode]");
  if (dm) { dvMode = dm.dataset.dvmode; dvBoard = 0; dvSel = null; saveMb(); renderDv(); return; }
  const db = e.target.closest("[data-dvboard]");
  if (db) { dvBoard = +db.dataset.dvboard; dvSel = null; renderDv(); return; }
  const ds = e.target.closest("[data-dvstep]");
  if (ds) {
    dvSel = +ds.dataset.dvstep;
    const V = dvView(), s = V.list[dvSel];
    dvBoard = V.boards.findIndex(x => x.id === s.b);
    renderDv(); return;
  }
  const eq = e.target.closest("[data-eq]");
  if (eq) { eqStage = +eq.dataset.eq; renderEq(); return; }
  const bm = e.target.closest("[data-bossmap]");
  if (bm) { bossMapFilter = bm.dataset.bossmap; renderBoss(); return; }
  const bl = e.target.closest("[data-bosslvl]");
  if (bl) { bossLevelFilter = bl.dataset.bosslvl; renderBoss(); return; }
  const bsh = e.target.closest("[data-bossshowhidden]");
  if (bsh) { bossShowHidden = !bossShowHidden; renderBoss(); return; }
  const bfo = e.target.closest("[data-bossfavonly]");
  if (bfo) { bossFavOnly = !bossFavOnly; renderBoss(); return; }
  const bfa = e.target.closest("[data-bossfaction]");
  if (bfa) { bossFaction = bfa.dataset.bossfaction; try { localStorage.setItem("aion2BossFaction", bossFaction); } catch(e){} renderBoss(); return; }
  const ba = e.target.closest("[data-bossact]");
  if (ba) {
    const id = ba.dataset.bid;
    if (ba.dataset.bossact === "mark") markBoss(id);
    else if (ba.dataset.bossact === "settime") setBossRemaining(id);
    else if (ba.dataset.bossact === "fav") toggleFavorite(id);
    else if (ba.dataset.bossact === "rename") renameBoss(id);
    else if (ba.dataset.bossact === "hide") { const bb = allBosses().find(x => x.id === id); hideBoss(id, !(bb && bb.hidden)); }
    else if (ba.dataset.bossact === "clear") clearBoss(id);
    else if (ba.dataset.bossact === "clearall") clearAllBosses();
    return;
  }
  if (e.target.id === "bossAddBtn") { addBoss(); return; }
  const tb = e.target.closest("[data-tab]");
  if (tb) { tab = tb.dataset.tab; history.replaceState(null, "", "#" + tab); render(); window.scrollTo(0, 0); }
});

document.addEventListener("input", e => {
  if (e.target.id === "bossSearch") {
    bossQuery = e.target.value;
    document.querySelectorAll("[data-bossrow]").forEach(row => {
      const id = row.dataset.bossrow;
      const b = allBosses().find(x => x.id === id);
      if (!b) return;
      const q = bossQuery.toLowerCase();
      const show = !q || b.name.toLowerCase().includes(q) || b.map.toLowerCase().includes(q);
      row.style.display = show ? "" : "none";
    });
    return;
  }
  if (e.target.id === "dvpts") {
    dvPts[dvMode] = Math.max(0, +e.target.value || 0); saveMb();
    const pos = e.target.selectionStart; renderDv();
    const inp = $("dvpts"); inp.focus(); try { inp.setSelectionRange(pos, pos); } catch (err) {}
  }
});

setInterval(tickBoss, 1000);
if (bossGlobalConfigured()) {
  loadBossGlobal(true);
  setInterval(() => { if (!document.hidden) loadBossGlobal(false); }, BOSS_GLOBAL_POLL_MS);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) loadBossGlobal(true); });
  window.addEventListener("focus", () => loadBossGlobal(true));
}
Promise.all([fetch("skills.json").then(r => r.json()), fetch("daevanion.json").then(r => r.json())]).then(([d, dv]) => {
  SK = d; DVJ = dv;
  const h = location.hash.slice(1);
  if (["g", "jb", "lv", "boss"].includes(h)) tab = h;
  render();
  if (h.startsWith("mb-")) { const t = $(h); if (t) t.scrollIntoView(); }
});
</script>
</body>
</html>
