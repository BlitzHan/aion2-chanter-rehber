<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aion 2 Chanter Build</title>
<meta name="description" content="Aion 2 Chanter PvE build: skill puan sırası, uzmanlıklar, stigma, pasif ve macro. Early game ve mid game (Grobs).">
<link rel="icon" href="icons/ICON_CH_SKILL_019.webp">
<style>
:root{
  --bg:#0b0d12; --panel:#141822; --panel2:#1a1f2c; --line:#262d3f; --line2:#343d55;
  --text:#e7e9ef; --muted:#8e97ad; --dim:#5d667c;
  --gold:#e8c06a; --green:#5fd39a; --greenbg:#15281e; --purple:#b48cff; --purplebg:#231b3a; --red:#ff8080;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--gold)}
button{font:inherit;color:inherit}
.top{border-bottom:1px solid var(--line);background:linear-gradient(180deg,#191529,#0b0d12)}
.top .in{max-width:1240px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.cls{width:44px;height:44px;border-radius:10px;border:1px solid var(--line2)}
.top h1{font-size:20px;margin:0;line-height:1.2}
.top .sub{color:var(--muted);font-size:13px}
.tabs{margin-left:auto;display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:600}
.tabs button.on{background:var(--gold);color:#1b1404}
.layout{max-width:1240px;margin:0 auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:16px}
.card>h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0;padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.card>h2 .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:400;font-size:12px;color:var(--dim)}
.pad{padding:12px 14px}
.summary{display:flex;gap:10px;flex-wrap:wrap;padding:12px 14px;color:var(--muted)}
.summary b{color:var(--text)}
.pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px}
/* skill bar */
.bar{display:flex;flex-wrap:wrap;gap:8px}
.slot{position:relative;width:52px;height:52px;border-radius:9px;border:1px solid var(--line2);background:#000;cursor:pointer;padding:0;overflow:visible}
.slot img{width:100%;height:100%;border-radius:8px;display:block}
.slot .lv{position:absolute;right:-4px;bottom:-4px;background:#0b0d12;border:1px solid var(--gold);color:var(--gold);font-size:11px;font-weight:800;border-radius:6px;padding:0 4px;line-height:16px}
.slot .ch{position:absolute;left:-4px;top:-4px;background:var(--purple);color:#14092a;font-size:10px;font-weight:800;border-radius:5px;padding:0 4px;line-height:15px}
.slot.sel{outline:2px solid var(--gold);outline-offset:2px}
.group-l{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin:10px 0 6px}
.group-l:first-child{margin-top:0}
/* order table */
.order{list-style:none;margin:0;padding:0}
.order li{display:grid;grid-template-columns:28px 36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 14px;border-top:1px solid var(--line);cursor:pointer}
.order li:first-child{border-top:0}
.order li:hover{background:#181d29}
.order .n{width:24px;height:24px;border-radius:50%;background:var(--panel2);border:1px solid var(--line2);display:grid;place-items:center;font-weight:800;font-size:12px;color:var(--gold)}
.order li.key .n{background:var(--gold);color:#1b1404;border-color:var(--gold)}
.order img{width:36px;height:36px;border-radius:7px;border:1px solid var(--line2)}
.order .nm{font-weight:600}
.order .nm .to{color:var(--gold);font-weight:800;margin-left:6px}
.order .sp{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
.order .sp .new{color:var(--purple);font-weight:600}
.order .sp .ok{color:var(--green);font-weight:600}
.order .badge{font-size:11px;padding:2px 7px;border-radius:5px;background:var(--panel2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.order .badge.k{background:#3a2f12;color:var(--gold);border-color:#5d4a1c}
.foot{padding:8px 14px;color:var(--dim);font-size:12px;border-top:1px solid var(--line)}
/* macro */
.macro{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.macro .ln{font-size:11px;color:var(--dim);width:48px}
.macro img{width:36px;height:36px;border-radius:7px;border:1px solid var(--line2)}
.macro .ar{color:var(--gold)}
kbd{background:#232a3c;border:1px solid var(--line2);border-bottom-width:3px;border-radius:5px;padding:0 6px;font:600 12px ui-monospace,monospace}
.steps{margin:8px 0 0;padding-left:18px;color:var(--muted)}
.steps li{margin:3px 0}
.steps b{color:var(--text)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
/* detail */
.detail{position:sticky;top:16px}
.dh{display:flex;gap:12px;align-items:center;padding:14px;border-bottom:1px solid var(--line)}
.dh img{width:56px;height:56px;border-radius:10px;border:1px solid var(--line2)}
.dh .t{font-size:17px;font-weight:700}
.dh .m{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.tag{font-size:11px;padding:1px 7px;border-radius:5px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.tag.g{background:#3a2f12;color:var(--gold);border-color:#5d4a1c}
.ddesc{color:var(--muted);font-size:12.5px;padding:10px 14px 0}
.dwhy{padding:10px 14px}
.dwhy b{color:var(--gold)}
.specs{padding:0 14px 14px;display:flex;flex-direction:column;gap:6px}
.spec{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;font-size:12.5px;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:#10131b;color:var(--dim)}
.spec .l{font-size:11px;font-weight:700}
.spec .s{font-size:11px;font-weight:800}
.spec.on{background:var(--greenbg);border-color:#357050;color:var(--text)}
.spec.on .s{color:var(--green)}
.spec.new{background:var(--purplebg);border-color:#5f48a0;color:var(--text)}
.spec.new .s{color:var(--purple)}
.spec.drop{color:#8a6a6a}
.spec.drop span:nth-child(2){text-decoration:line-through}
.spec.drop .s{color:var(--red)}
.hint{color:var(--dim);font-size:12px;padding:0 14px 12px}
details{border-top:1px solid var(--line)}
details summary{cursor:pointer;padding:10px 14px;font-weight:600}
details .pad{padding-top:0;color:var(--muted)}
details .pad b{color:var(--text)}
footer{max-width:1240px;margin:0 auto;padding:4px 16px 32px;color:var(--dim);font-size:12px}
/* daevanion */
.btabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.btabs button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--muted)}
.btabs button.on{border-color:var(--gold);color:var(--gold);background:#2a2412}
.btabs button small{color:var(--dim);margin-left:4px}
.dwrap{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px;align-items:start}
.dg{display:grid;grid-template-columns:repeat(11,1fr);gap:3px;background:#0c0f16;border:1px solid var(--line);border-radius:10px;padding:8px}
.dg .nd{position:relative;aspect-ratio:1;border-radius:6px;display:grid;place-items:center}
.dg .nd img{width:100%;height:100%;object-fit:cover;border-radius:5px;display:block}
.dg .nd.off img{opacity:.28;filter:grayscale(.7)}
.dg .nd.off .lb{opacity:.45}
.dg .nd.on{box-shadow:0 0 0 2px var(--gold),0 0 10px #e8c06a55}
.dg .nd.sk.on{box-shadow:0 0 0 2px #b48cff,0 0 10px #b48cff66}
.dg .nd.un.on{box-shadow:0 0 0 2px #ff9f5a,0 0 10px #ff9f5a66}
.dg .lb{position:absolute;left:0;right:0;bottom:1px;text-align:center;font-size:9px;font-weight:800;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000;letter-spacing:.02em;pointer-events:none}
.dg .no{position:absolute;top:-5px;left:-5px;min-width:17px;height:17px;padding:0 3px;border-radius:9px;background:var(--gold);color:#1b1404;font-size:10px;font-weight:900;display:grid;place-items:center;z-index:1}
.dg .nd.sk .no{background:var(--purple);color:#14092a}
.dg .nd.un .no{background:#ff9f5a}
.dg .nd.keep{box-shadow:0 0 0 2px #357050}
.dg .nd.keep .no{background:var(--green);color:#06210f}
.dg .nd.drop{box-shadow:0 0 0 2px var(--red),0 0 10px #ff808066}
.dg .nd.drop img{opacity:.45}
.dg .nd.drop .no{background:var(--red);color:#2a0606}
.phase-sw{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:2px;margin-left:8px;text-transform:none;letter-spacing:0}
.phase-sw button{border:0;background:none;padding:3px 10px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:700;font-size:12px}
.phase-sw button.on{background:var(--gold);color:#1b1404}
.btabs button .dr{color:var(--red);margin-left:4px;font-size:11px}
.steps2 li.hd{display:block;background:#0f1219;color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.steps2 li.drop{background:#2a1416}
.steps2 li.drop .n{color:var(--red)}
.keepnote{background:var(--greenbg);border:1px solid #357050;border-radius:8px;padding:6px 10px;font-size:12.5px;margin-bottom:8px}
.steps2{list-style:none;margin:0;padding:0;max-height:560px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.steps2 li{display:grid;grid-template-columns:26px 26px 1fr auto;gap:8px;align-items:center;padding:5px 10px;border-top:1px solid var(--line);font-size:12.5px}
.steps2 li:first-child{border-top:0}
.steps2 .n{font-weight:900;color:var(--gold);text-align:right}
.steps2 img{width:26px;height:26px;border-radius:5px}
.steps2 .c{color:var(--dim);font-size:11px}
.steps2 li.sk{background:#1c1730}
.steps2 li.un{background:#2a1d12}
.dlegend{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:12px;margin-top:10px}
.dlegend b{color:var(--text)}
/* kişisel dizilim */
.hb-wrap{overflow-x:auto}
.hb{display:grid;grid-template-columns:repeat(12,minmax(46px,1fr));gap:6px;min-width:620px;align-items:end}
.hb .col{display:flex;flex-direction:column-reverse;gap:4px;padding:4px;border-radius:8px;border:1px solid transparent}
.hb .col.chg{border-color:#5f48a0;background:var(--purplebg)}
.hb .col.rm{border-color:#6a3a3a;background:#2a1718}
.hb .key{text-align:center;font-weight:800;font-size:12px;color:var(--gold);order:-1}
.hb .cell{position:relative;aspect-ratio:1;border-radius:7px;border:1px solid var(--line);background:#10131b;cursor:pointer}
.hb .cell img{width:100%;height:100%;border-radius:6px;display:block}
.hb .cell .lv{position:absolute;right:-3px;bottom:-3px;background:#0b0d12;border:1px solid var(--line2);color:var(--text);font-size:10px;font-weight:800;border-radius:5px;padding:0 3px;line-height:14px}
.hb .cell.empty{cursor:default;border-style:dashed}
.hb .cell.x img{opacity:.35;filter:grayscale(1)}
.hb .cell.x::after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;color:var(--red);font-weight:900;font-size:20px}
.hb .cell.try{outline:2px dashed var(--purple);outline-offset:1px}
.hb-l{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin:4px 0 6px}
.chg-list{list-style:none;margin:0;padding:0}
.chg-list li{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:start;padding:9px 14px;border-top:1px solid var(--line)}
.chg-list li:first-child{border-top:0}
.chg-list .k{font-weight:800;color:var(--gold);background:var(--panel2);border:1px solid var(--line2);border-radius:7px;text-align:center;padding:4px 0}
.chg-list b{color:var(--text)}
.chg-list .d{color:var(--muted)}
.lvls{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.lvls img{width:32px;height:32px;border-radius:6px;border:1px solid var(--line2)}
.lvls .now{font-weight:800;white-space:nowrap}
.lvls .now em{font-style:normal;color:var(--gold)}
.lvls .now.stop em{color:var(--red)}
.lvls .note{color:var(--muted);font-size:12.5px}
/* ek bilgiler */
.path{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.path .p{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px}
.path .p .v{font-size:22px;font-weight:900;color:var(--gold)}
.path .p .t{font-weight:700;margin:2px 0}
.path .p .d{color:var(--muted);font-size:12.5px}
.path .p.end{border-color:#5f48a0;background:var(--purplebg)}
.path .p.end .v{color:var(--purple)}
.prio{list-style:none;margin:0;padding:0}
.prio li{display:grid;grid-template-columns:26px 36px minmax(0,1fr);gap:10px;align-items:center;padding:8px 14px;border-top:1px solid var(--line);cursor:pointer}
.prio li:first-child{border-top:0}
.prio li:hover{background:#181d29}
.prio .n{font-weight:900;color:var(--gold);text-align:right}
.prio img{width:36px;height:36px;border-radius:7px;border:1px solid var(--line2)}
.prio .d{color:var(--muted);font-size:12.5px}
.prio li.no .n{color:var(--red)}
.prio li.no img{filter:grayscale(1);opacity:.6}
.loads{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.load{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px}
.load .h{font-weight:700;margin-bottom:6px}
.load .ic{display:flex;gap:6px;flex-wrap:wrap}
.load .ic img{width:40px;height:40px;border-radius:7px;border:1px solid var(--line2);cursor:pointer}
.load .d{color:var(--muted);font-size:12.5px;margin-top:6px}
.dvp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.dvp .b{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.dvp .b img{width:40px;height:40px}
.dvp .b .nm{font-weight:700}
.dvp .b .st{color:#ff9f5a;font-weight:700;font-size:13px}
.dvp .b .sk{display:flex;gap:4px;justify-content:center;margin-top:6px}
.dvp .b .sk img{width:24px;height:24px;border-radius:5px}
table.cmp{width:100%;border-collapse:collapse;font-size:13px}
table.cmp th,table.cmp td{text-align:left;padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
table.cmp th{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.05em;border-top:0}
table.cmp td:first-child{font-weight:700;white-space:nowrap}
table.cmp td{color:var(--muted)}
.tipbox{background:#2a2412;border:1px solid #5d4a1c;border-radius:10px;padding:10px 12px}
.tipbox b{color:var(--gold)}
.prio .lvt{color:var(--gold);font-weight:800;margin-left:6px}
.prio .spx{font-size:12px;color:var(--green);margin-top:2px}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.shots figure{margin:0}
.shots img{width:100%;border-radius:8px;border:1px solid var(--line2);display:block}
.shots figcaption{color:var(--muted);font-size:12px;margin-top:4px}
.shot1 img{max-width:100%;border-radius:8px;border:1px solid var(--line2);display:block}
table.cmp td.w{white-space:normal}
.ptsrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0}
.ptsrow input{width:110px;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;color:var(--text);font:inherit;font-weight:700;padding:6px 10px}
.ptsrow span{color:var(--dim);font-size:12px}
#tdv .steps2 li{cursor:pointer}
#tdv .steps2 li.done{opacity:.55}
#tdv .steps2 li.done .n{color:var(--green)}
#tdv .steps2 li.sel{outline:2px solid var(--gold);outline-offset:-2px}
@media (max-width:1100px){#sbdv .dwrap{grid-template-columns:1fr}#sbdv .steps2{max-height:360px}}
.dg .nd.hl{animation:hl 1s ease-in-out infinite alternate;z-index:2}
@keyframes hl{from{box-shadow:0 0 0 2px #fff,0 0 4px #fff8}to{box-shadow:0 0 0 3px #fff,0 0 16px #fffc}}
.plan .pl{font-weight:800;margin:18px 0 8px;font-size:14px}
.plan .pl:first-child{margin-top:0}
.plan .pl span{font-weight:400;color:var(--dim);font-size:12px;margin-left:6px}
.lvbar{display:grid;grid-template-columns:repeat(10,minmax(0,1fr)) minmax(0,2fr);gap:4px}
.lvbar .lb{border-radius:7px;padding:6px 2px;text-align:center;border:1px solid var(--line);background:var(--panel2)}
.lvbar .lb span{display:block;font-size:10.5px;color:var(--muted)}
.lvbar .lb b{display:block;font-size:13px;min-height:18px}
.lvbar .c1{background:#15281e;border-color:#245c3c}.lvbar .c1 b{color:var(--green)}
.lvbar .c2{background:#2a2412;border-color:#5d4a1c}.lvbar .c2 b{color:var(--gold)}
.lvbar .c4{background:#2a1718;border-color:#6a3a3a}.lvbar .c4 b{color:var(--red)}
.lvbar .ext{background:var(--purplebg);border-color:#5f48a0}.lvbar .ext b{color:var(--purple);font-size:11px}
.lvnote{color:var(--muted);font-size:12.5px;margin:6px 0 10px}
.lvnote b{color:var(--text)}
.stack{display:flex;gap:3px;border-radius:8px;overflow:hidden;font-size:11.5px;font-weight:700;text-align:center}
.stack div{padding:7px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stack .s1{background:#3a2f12;color:var(--gold)}.stack .s2{background:var(--purplebg);color:var(--purple)}.stack .s3{background:#16263a;color:#7fb6ff}
.ptiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ptiles.sm{grid-template-columns:repeat(5,minmax(0,1fr))}
.pt{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 8px;text-align:center;cursor:pointer}
.pt:hover{border-color:var(--line2)}
.pt>img{width:52px;height:52px;border-radius:9px;border:1px solid var(--line2);display:block;margin:0 auto}
.pt .pn{position:absolute;left:6px;top:6px;width:22px;height:22px;border-radius:50%;background:var(--gold);color:#1b1404;font-weight:800;font-size:12px;display:grid;place-items:center}
.pt .pto{position:absolute;right:6px;top:6px;color:var(--gold);font-weight:800;font-size:13px}
.pt .pnm{font-weight:700;font-size:12.5px;margin-top:6px}
.pt.dim{opacity:.6}
.pcs{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.pc{font-size:11px;background:#10131b;border:1px solid var(--line);border-radius:6px;padding:2px 5px;color:var(--green);text-align:left}
.pc b{display:inline-block;min-width:16px;color:#14092a;background:var(--green);border-radius:4px;text-align:center;margin-right:5px}
.pd{font-size:11.5px;color:var(--muted);margin-top:5px}
.prow{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.pbox{flex:1;min-width:180px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px}
.pbox .ph{font-weight:700;font-size:12.5px;margin-bottom:6px}
.pbox .pi{display:flex;gap:6px;flex-wrap:wrap}
.pbox .pi img{width:40px;height:40px;border-radius:7px;border:1px solid var(--line2);cursor:pointer}
.pbox.no{border-color:#6a3a3a;background:#2a1718;flex:0 0 auto}
.pbox.no .pi img{filter:grayscale(1);opacity:.7}
.tri img{width:170px;border-radius:8px;border:1px solid var(--line2);display:block}
@media (max-width:900px){
  .ptiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ptiles.sm{grid-template-columns:repeat(3,minmax(0,1fr))}
  .lvbar{grid-template-columns:repeat(5,minmax(0,1fr))}
  .lvbar .ext{grid-column:span 5}
  .tri img{width:100%}
}
@media (max-width:900px){
  .path,.dvp{grid-template-columns:repeat(2,minmax(0,1fr))}
  .loads{grid-template-columns:1fr}
  .tabs{display:grid;grid-template-columns:1fr 1fr}
}
@media (max-width:900px){
  .dwrap{grid-template-columns:1fr}
  .steps2{max-height:none}
  .dg{gap:2px;padding:5px}
  .dg .lb{font-size:7.5px}
  .layout{grid-template-columns:minmax(0,1fr)}
  .tabs button{padding:7px 6px;font-size:13px}
  .detail{position:fixed;left:0;right:0;bottom:0;top:auto;margin:0;max-height:70vh;overflow:auto;border-radius:14px 14px 0 0;transform:translateY(105%);transition:transform .2s;z-index:20;box-shadow:0 -10px 30px #000a}
  .detail.open{transform:none}
  .detail .close{display:block}
  .two{grid-template-columns:1fr}
  .tabs{margin-left:0;width:100%}
  .tabs button{flex:1}
  .order li{grid-template-columns:24px 32px minmax(0,1fr);padding:8px 12px}
  .order .badge{display:none}
  .order img{width:32px;height:32px}
}
.close{display:none;margin-left:auto;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer}
/* 45+ yol haritası */
.layout.solo{grid-template-columns:minmax(0,1fr)}
.layout.solo .detail{display:none}
.gs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.gs .s{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;position:relative}
.gs .s .v{font-size:22px;font-weight:800;color:var(--gold);line-height:1.1}
.gs .s .v small{font-size:11px;color:var(--dim);font-weight:600;margin-left:3px}
.gs .s ul{margin:6px 0 0;padding:0;list-style:none;font-size:12.5px;color:var(--muted)}
.gs .s li{margin:2px 0}
.gs .s.now{border-color:var(--gold);background:#2a2412}
.gs .s.now:before{content:"ŞİMDİKİ HEDEF";display:inline-block;margin-bottom:4px;font-size:9.5px;font-weight:800;color:#1b1404;background:var(--gold);border-radius:4px;padding:1px 5px}
.road{list-style:none;margin:0;padding:0}
.road>li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.road>li:first-child{border-top:0}
.road .n{width:30px;height:30px;border-radius:50%;background:var(--gold);color:#1b1404;font-weight:800;display:grid;place-items:center}
.road .h{font-weight:700;font-size:14.5px}
.road .h kbd{margin-left:6px}
.road .g{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.road .g span{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--greenbg);color:var(--green);border:1px solid #245c3c}
.road .d{color:var(--muted);font-size:13px}
.road .d b{color:var(--text)}
.rt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.rt .c{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.rt .c .h{font-weight:800;margin-bottom:6px}
.rt .c ul{margin:0;padding-left:18px;color:var(--muted);font-size:12.5px}
.rt .c li{margin:3px 0}
.rt .c b{color:var(--text)}
.donts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.donts div{background:#2a1718;border:1px solid #6a3a3a;border-radius:10px;padding:10px 12px;color:var(--muted);font-size:12.5px}
.donts div b{color:var(--red);display:block;margin-bottom:3px;font-size:13px}
@media (max-width:900px){
  .gs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rt,.donts{grid-template-columns:1fr}
}
/* sınıf buildleri */
.sbsel{display:flex;flex-direction:column;gap:10px;padding:12px 14px}
.sbsel .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sbsel .lb{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;width:58px}
.sbcls button{display:inline-flex;align-items:center;gap:8px;font-weight:700}
.sbcls button img{width:24px;height:24px;border-radius:6px}
.sbtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.sbt{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 8px 8px;text-align:center;cursor:pointer}
.sbt:hover{border-color:var(--line2)}
.sbt.sel{outline:2px solid var(--gold);outline-offset:1px}
.sbt>img{width:48px;height:48px;border-radius:9px;border:1px solid var(--line2);display:block;margin:0 auto}
.sbt .lv{position:absolute;right:6px;top:6px;color:var(--gold);font-weight:900;font-size:15px;line-height:1;text-align:right}
.sbt .lv small{display:block;font-size:10px;color:var(--purple);font-weight:800;margin-top:2px}
.sbt .nm{font-weight:700;font-size:12.5px;margin-top:6px}
.sbt .rl{font-size:11px;color:var(--dim)}
.sbt.lo{opacity:.5}
.sbt.lo .lv{color:var(--muted)}
.sbt.key{border-color:#5d4a1c;background:#2a2412}
.sbt .pc.later{color:var(--purple)}
.sbt .pc.later b{background:var(--purple)}
.sbchain{display:flex;align-items:flex-start;gap:6px;flex-wrap:wrap}
.sbchain .st{width:76px;text-align:center;cursor:pointer}
.sbchain .st img{width:40px;height:40px;border-radius:7px;border:1px solid var(--line2);display:block;margin:0 auto}
.sbchain .st b{display:block;font-size:11px;margin-top:3px;line-height:1.25}
.sbchain .ar{color:var(--gold);font-weight:800;margin-top:10px}
.sbtxt{color:var(--muted);font-size:13px}
.sbtxt b{color:var(--text)}
.sbul{margin:6px 0 0;padding-left:18px;color:var(--muted);font-size:12.5px}
.sbul li{margin:3px 0}
.sbbd{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px 0}
#sbdv .steps2 li{cursor:pointer}
#sbdv .steps2 li.done{opacity:.55}
#sbdv .steps2 li.done .n{color:var(--green)}
#sbdv .steps2 li.sel{outline:2px solid var(--gold);outline-offset:-2px}
#sbdv .dg .nd[data-sbdvs]{cursor:pointer}
@media (max-width:900px){.sbtiles{grid-template-columns:repeat(2,minmax(0,1fr))}.sbsel .lb{width:100%}.sbchain .st{width:64px}}
/* boss timer */
.boss-tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.boss-tools input{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--text);min-width:160px}
.boss-tools button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--muted);font-size:12px}
.boss-tools button.on{border-color:var(--gold);color:var(--gold);background:#2a2412}
.bosstable{width:100%;border-collapse:collapse}
.bosstable th,.bosstable td{padding:8px 6px;border-top:1px solid var(--line);text-align:left;font-size:13px;vertical-align:middle}
.bosstable th{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.06em;border-top:0}
.bossname{font-weight:600}
.bossmap{color:var(--muted);font-size:12px}
.boss-cd{font-variant-numeric:tabular-nums;font-weight:700}

.boss-actions button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 8px;cursor:pointer;color:var(--muted);font-size:12px;margin-left:4px}
.boss-actions button.mark{border-color:#5d4a1c;color:var(--gold)}

// Daevanion yol haritası: tablodaki tahta görsellerinden okunan düğümler, global adım sırasıyla (daevanion.json "tablo")
let tBoard = 0, tStep = null, tPts = 0;
try { tPts = +new URLSearchParams(location.search).get("p") || +localStorage.getItem("tpts") || 0; } catch (e) {}
function tSteps() {
  const S = {};
  DV.forEach((b, bi) => (b.tablo || []).forEach(([id, s]) => {
    const n = b.nodes.find(x => x.id === id);
    (S[s] = S[s] || {s, bi, ids: [], cost: 0}).ids.push(id); S[s].cost += n.cost;
  }));
  let cum = 0;
  return Object.values(S).sort((a, b) => a.s - b.s).map(x => {
    cum += x.cost; const b = DV[x.bi], last = b.nodes.find(n => n.id === x.ids[x.ids.length - 1]);
    const big = x.ids.map(id => b.nodes.find(n => n.id === id)).filter(n => n.t === "skilllevel" || n.g >= 41);
    return Object.assign(x, {cum, target: big.length ? big[big.length - 1] : last, rest: !big.length});
  });
}
function renderTDaev() {
  const el = $("tdvb"); if (!el || !DV) return;
  const steps = tSteps(), b = DV[tBoard], stepOf = {};
  (b.tablo || []).forEach(([id, s]) => stepOf[id] = s);
  const doneS = steps.filter(x => x.cum <= tPts).length;
  const rs = b.nodes.map(n => n.r), cs = b.nodes.map(n => n.c);
  const r0 = Math.min(...rs), r1 = Math.max(...rs), c0 = Math.min(...cs), c1 = Math.max(...cs);
  const map = {}; b.nodes.forEach(n => map[n.r + "-" + n.c] = n);
  let cells = "";
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    const n = map[r + "-" + c];
    if (!n) { cells += "<div></div>"; continue; }
    const f = nodeInfo(n), s = stepOf[n.id];
    let st = n.t === "start" ? "on" : s ? (s <= doneS ? "on keep" : "on") : "off";
    if (s && s === tStep) st += " hl";
    const badge = s ? (s <= doneS ? "✓" : s) : "";
    cells += `<div class="nd ${f.cls} ${st}" title="${f.name}${n.cost ? " · " + n.cost + " puan" : ""}${s ? " · adım " + s : ""}"><img src="${f.img}" alt="">${f.lb ? `<span class="lb">${f.lb}</span>` : ""}${badge ? `<span class="no">${badge}</span>` : ""}</div>`;
  }
  const bp = DV.map((x, i) => steps.filter(s => s.bi === i).reduce((a, s) => a + s.cost, 0));
  const next = steps[doneS];
  el.innerHTML = `
    <div class="btabs">${DV.map((x, i) => `<button data-tboard="${i}" class="${i === tBoard ? "on" : ""}">${x.name}<small>Lv ${x.need} · ${bp[i]} p</small></button>`).join("")}</div>
    ${tPts ? `<div class="keepnote">${doneS ? `✓ ${doneS} adım bitti (${steps[doneS - 1].cum} puan).` : "Henüz bir adım bitmiyor."} ${next ? `Sıradaki: <b>${next.s}. adım</b>, ${DV[next.bi].name} · ${next.rest ? "kalan düğümler" : nodeInfo(next.target).name} (${next.cost} puan, ${next.cum - tPts} puan eksik).` : "Plan tamam."}</div>` : ""}
    <div class="dwrap">
      <div><div class="dg" style="grid-template-columns:repeat(${c1 - c0 + 1},1fr)">${cells}</div>
        <div class="dlegend"><span><b>Numara</b> = adım (bütün tahtalarda ortak sıra)</span><span><b style="color:var(--green)">✓</b> = puanınla alınmış</span><span><b style="color:var(--purple)">Mor</b> = skill +1</span><span><b style="color:#ff9f5a">Turuncu</b> = büyük stat</span><span>Soluk = bu build'de alınmıyor</span></div></div>
      <ol class="steps2">${steps.map(x => {
        const f = nodeInfo(x.target);
        return `<li class="${x.s <= doneS ? "done" : ""} ${x.s === tStep ? "sel" : ""} ${x.rest ? "" : f.cls}" data-tstep="${x.s}"><span class="n">${x.s <= doneS ? "✓" : x.s}</span><img src="${f.img}" alt=""><span>${x.rest ? "Kalan düğümler" : f.name}<br><small style="color:var(--dim)">${DV[x.bi].name}</small></span><span class="c">${x.cost} p<br>Σ ${x.cum}</span></li>`;
      }).join("")}</ol>
    </div>`;
  const sel = el.querySelector(".steps2 li.sel"); if (sel) sel.scrollIntoView({block: "nearest"});
}

const KEYS = ["1","2","3","4","5","6","7","8","Q","E","Sol","Sağ"];
const KEYLBL = k => k === "4" ? "4 · R" : k;

function hotbar(layout, diff, plain) {
  return `<div class="hb-wrap"><div class="hb">${KEYS.map(k => {
    const col = layout[k] || [];
    let cls = "col";
    if (diff) {
      const a = JSON.stringify((BUILDS.me.cur[k]||[]).map(x=>x[0])), b = JSON.stringify(col.map(x=>x[0]));
      if (a !== b) cls += col.length < (BUILDS.me.cur[k]||[]).length && !col.some(x=>x[2]) ? " rm" : " chg";
    }
    const cells = col.length ? col.map(([id, lv, f]) => {
      const gone = !diff && !plain && !Object.values(BUILDS.me.next).flat().some(x => x[0] === id);
      return `<div class="cell ${gone ? "x" : ""} ${f === "try" ? "try" : ""}" data-id="${id}" title="${SK[id].name}"><img src="${SK[id].icon}" alt="${SK[id].name}"><span class="lv">${lv}</span></div>`;
    }).join("") : `<div class="cell empty"></div>`;
    return `<div class="${cls}">${cells}<div class="key">${plain ? k : KEYLBL(k)}</div></div>`;
  }).join("")}</div></div>`;
}

let DV = null, board = 0;
const ST = {
  fixingdamage:["SLD","Saldırı"], hpmax:["HP","Maks HP"], mpmax:["MP","Maks MP"], defense:["SVN","Savunma"],
  critical:["KRT","Kritik"], criticalresist:["KDİ","Kritik direnci"],
  combatspeed:["HIZ","Savaş hızı"], amplifyalldamage:["HSR","Hasar artışı"], amplifycriticaldamage:["KHA","Kritik hasar artışı"],
  cooltimedecrease:["CD","Cooldown azaltma"], additionalhitrate:["ÇVR","Multi-Hit (çoklu vuruş)"], additionalhitresistrate:["ÇVD","Multi-Hit direnci"], decreasecriticaldamage:["KHD","Kritik hasar direnci"], decreasedamage:["HAZ","Hasar azaltma"]
};
function nodeInfo(n) {
  if (n.t === "start") return {img:"icons/dv/Start.webp", lb:"", name:"Başlangıç", cls:"st"};
  if (n.t === "skilllevel") return {img:n.icon, lb:"+1", name:n.name + " +1 seviye", cls:"sk"};
  const st = ST[n.stat] || [n.name.slice(0,3).toUpperCase(), n.name];
  const un = n.g >= 41;
  return {img:"icons/dv/" + (un ? "Unique" : "Common") + ".webp", lb:st[0], name:st[1] + (un ? " (büyük)" : ""), cls:un ? "un" : "st"};
}
let dphase = null;
function renderDaev() {
  const el = $("daev");
  if (tab === "me" || !DV) { el.hidden = true; return; }
  el.hidden = false;
  const ph = dphase || tab;
  const boards = DV.filter(x => ph === "early" ? x.early.length : (x.keep.length + x.add.length));
  if (board >= boards.length) board = 0;
  const b = boards[board];
  const byId = {}; b.nodes.forEach(n => byId[n.id] = n);
  const cost = L => L.reduce((a, id) => a + byId[id].cost, 0);
  const num = {}, state = {};
  if (ph === "early") b.early.forEach((id, i) => { num[id] = i + 1; state[id] = "on"; });
  else {
    b.keep.forEach(id => state[id] = "keep");
    b.add.forEach((id, i) => { num[id] = i + 1; state[id] = "on"; });
    b.drop.forEach(id => state[id] = "drop");
  }
  const map = {}; b.nodes.forEach(n => map[n.r + "-" + n.c] = n);
  let cells = "";
  const R0 = Math.min(...b.nodes.map(n => n.r)), R1 = Math.max(...b.nodes.map(n => n.r)), C0 = Math.min(...b.nodes.map(n => n.c)), C1 = Math.max(...b.nodes.map(n => n.c));
  for (let r = R0; r <= R1; r++) for (let c = C0; c <= C1; c++) {
    const n = map[r + "-" + c];
    if (!n) { cells += "<div></div>"; continue; }
    const f = nodeInfo(n), st = state[n.id] || (n.t === "start" ? "on" : "off");
    const badge = st === "keep" ? "✓" : st === "drop" ? "✕" : (num[n.id] || "");
    cells += `<div class="nd ${f.cls} ${st === "on" || st === "off" ? st : "on " + st}" title="${f.name}${n.cost ? " · " + n.cost + " puan" : ""}${st === "drop" ? " · GERİ AL" : ""}">
      <img src="${f.img}" alt="">${f.lb ? `<span class="lb">${f.lb}</span>` : ""}${badge ? `<span class="no">${badge}</span>` : ""}</div>`;
  }
  const row = (id, n, cls) => { const x = byId[id], f = nodeInfo(x); return `<li class="${f.cls} ${cls || ""}"><span class="n">${n}</span><img src="${f.img}" alt=""><span>${f.name}</span><span class="c">${x.cost} p</span></li>`; };
  let list = "", info = "";
  if (ph === "early") {
    info = `${b.name} · ${b.early.length} düğüm · ${cost(b.early)} puan`;
    list = b.early.map((id, i) => row(id, i + 1)).join("");
  } else {
    info = `${b.name} · mid toplam ${cost(b.keep) + cost(b.add)} puan`;
    if (b.drop.length) list += `<li class="hd">1 · Önce geri al (${cost(b.drop)} puan geri gelir)</li>` + b.drop.map(id => row(id, "✕", "drop")).join("");
    list += `<li class="hd">${b.drop.length ? "2 · " : ""}Sonra sırayla ekle (${cost(b.add)} puan)</li>` + b.add.map((id, i) => row(id, i + 1)).join("");
  }
  const totalP = ph === "early" ? 85 : 325;
  el.innerHTML = `<h2>Daevanion <span class="phase-sw"><button data-dphase="early" class="${ph === "early" ? "on" : ""}">Early</button><button data-dphase="mid" class="${ph === "mid" ? "on" : ""}">Mid · 45</button></span><span class="r">U tuşu · toplam ${totalP} puan</span></h2>
    <div class="pad">
      <div class="btabs">${boards.map((x, i) => {
        const bi = {}; x.nodes.forEach(n => bi[n.id] = n);
        const p = (ph === "early" ? x.early : x.add).reduce((a, id) => a + bi[id].cost, 0);
        return `<button data-board="${i}" class="${i === board ? "on" : ""}">${x.name}<small>Lv ${x.need} · ${ph === "mid" ? "+" : ""}${p} p</small>${ph === "mid" && x.drop.length ? `<span class="dr">✕${x.drop.length}</span>` : ""}</button>`;
      }).join("")}</div>
      <div class="dwrap">
        <div>
          <div class="dg" style="grid-template-columns:repeat(${C1 - C0 + 1},1fr)">${cells}</div>
          <div class="dlegend">
            ${ph === "mid" ? `<span><b style="color:var(--green)">✓</b> = early'de aldın, kalsın</span><span><b style="color:var(--red)">✕</b> = geri al</span><span><b>Numara</b> = ekleme sırası</span>` : `<span><b>Numara</b> = alma sırası</span>`}
            <span><b style="color:var(--purple)">Mor</b> = skill +1 seviye</span>
            <span><b style="color:#ff9f5a">Turuncu</b> = büyük stat</span>
            <span>SLD saldırı · HP · MP · SVN savunma · KRT kritik · KDİ kritik direnci · ÇVR multi-hit · HIZ savaş hızı · HSR hasar artışı · CD cooldown</span>
          </div>
        </div>
        <div>
          <div class="hb-l">${info}</div>
          ${ph === "mid" && b.keep.length ? `<div class="keepnote">✓ Early'den ${b.keep.length} düğüm (${cost(b.keep)} p) aynen kalıyor.</div>` : ""}
          <ol class="steps2">${list}</ol>
        </div>
      </div>
    </div>`;
}

  Object.keys(own).forEach(k => $(k).hidden = tab !== k); $("std").hidden = tab in own; $("boss").hidden = true;
  if (tab in own) { own[tab](); showDetail(selected && BUILDS[tab].skills[selected] ? selected : "18100000", false); return; }
  const B = BUILDS[tab];
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  $("summary").innerHTML = B.summary.map(s => `<span class="pill">${s}</span>`).join("");

  $("bars").innerHTML = B.bars.map(([label, ids]) =>
    `<div class="group-l">${label}</div><div class="bar">${ids.map(id => {
      const c = B.skills[id];
      const ch = (c.add && c.add.length) ? `<span class="ch">YENİ</span>` : "";
      return `<button class="slot" data-id="${id}" title="${SK[id].name}"><img src="${icon(id)}" alt="${SK[id].name}">${ch}<span class="lv">${c.lvl}</span></button>`;
    }).join("")}</div>`).join("");

  $("ordhint").textContent = tab === "early" ? "Yukarıdan aşağı puan ver" : "45 sonrası öncelik";
  $("order").innerHTML = B.order.map(([id, lvl, slots, note, key], i) => {
    const c = B.skills[id], isNew = c.add && slots.some(s => c.add.includes(s));
    const sp = specTxt(id, slots);
    const spHtml = sp.length ? `<span class="${isNew ? "new" : "ok"}">${isNew ? "Yeni uzmanlık" : "Uzmanlık"}:</span> ${sp.join(" · ")}` : (note || "");
    return `<li class="${key ? "key" : ""}" data-id="${id}">
      <span class="n">${i + 1}</span><img src="${icon(id)}" alt="">
      <div><div class="nm">${SK[id].name}<span class="to">→ ${lvl}</span></div><div class="sp">${spHtml}</div></div>
      ${note && sp.length ? `<span class="badge ${key ? "k" : ""}">${note}</span>` : (key ? `<span class="badge k">Kilit</span>` : "")}
    </li>`;
  }).join("");
  $("ordfoot").textContent = B.orderFoot;

  $("macro").innerHTML = B.macro.map((line, i) =>
    `<div class="macro"><span class="ln">Satır ${i + 1}</span>${line.map((id, j) => (j ? `<span class="ar">›</span>` : "") + `<img src="${icon(id)}" title="${SK[id].name}" alt="${SK[id].name}" data-id="${id}" style="cursor:pointer">`).join("")}</div>`
  ).join("") + `<div style="color:var(--muted)">${B.macroNote}</div>`;
  $("rot").innerHTML = B.rot.map(r => `<li>${r}</li>`).join("");

  $("notes").innerHTML = `<h2>Bilmen gerekenler</h2>` + B.notes.map(([t, b], i) =>
    `<details ${i === 0 && tab === "mid" ? "open" : ""}><summary>${t}</summary><div class="pad">${b}</div></details>`).join("");

  renderDaev();
  if (!selected || !B.skills[selected]) selected = B.bars[0][1][0];
  showDetail(selected, false);
}

function showDetail(id, open = true) {
  selected = id;
  const B = BUILDS[tab], c = B.skills[id], s = SK[id];
  if (!c) return;
  document.querySelectorAll(".slot").forEach(e => e.classList.toggle("sel", e.dataset.id === id));
  const pick = new Set(c.pick), add = new Set(c.add || []), drop = new Set(c.drop || []);
  const specs = s.specs.map(p => {
    let cls = "spec", st = "";
    if (add.has(p.slot)) { cls += " new"; st = "YENİ"; }
    else if (pick.has(p.slot)) { cls += " on"; st = "SEÇ"; }
    else if (drop.has(p.slot)) { cls += " drop"; st = "BIRAK"; }
    return `<div class="${cls}"><span class="l">Lv ${p.lvl}</span><span>${p.txt}</span><span class="s">${st}</span></div>`;
  }).join("");
  $("detail").innerHTML = `
    <div class="dh"><img src="${s.icon}" alt=""><div><div class="t">${s.name}</div>
      <div class="m"><span class="tag">${typeTR(s.type)}</span><span class="tag g">Hedef: ${c.lvl}</span></div></div>
      <button class="close" onclick="document.getElementById('detail').classList.remove('open')">Kapat</button></div>
    <div class="ddesc">${s.desc}</div>
    <div class="dwhy">${c.why}</div>
    ${s.specs.length ? `<div class="hint">Uzmanlıklar: skill bu seviyeye gelince açılır.</div><div class="specs">${specs}</div>` : ""}`;
  if (open) $("detail").classList.add("open");
}

document.addEventListener("click", e => {
  const sbx = e.target.closest("[data-sb]");
  if (sbx) sbDetail(sbx.dataset.sb);
  const sbb = e.target.closest("[data-sbc],[data-sbs],[data-sbm]");
  if (sbb) { const d = sbb.dataset; if (d.sbc) { sbCls = d.sbc; sbSel = null; } if (d.sbs) sbStage = +d.sbs; if (d.sbm) sbMode = d.sbm; sbDvPts = null; sbDvSel = null; renderSb(); }
  const sdb = e.target.closest("[data-sbdvb]");
  if (sdb) { sbDvB = +sdb.dataset.sbdvb; sbDvSel = null; renderSbDv(); }
  const sds = e.target.closest("[data-sbdvs]");
  if (sds) { sbDvSel = sds.dataset.sbdvs; sbDvB = +sbDvSel.split("-")[0]; renderSbDv(); }
  const t = e.target.closest("[data-id]");
  if (t) showDetail(t.dataset.id);
  const bb = e.target.closest("[data-board]");
  if (bb) { board = +bb.dataset.board; renderDaev(); }
  const dp = e.target.closest("[data-dphase]");
  if (dp) { dphase = dp.dataset.dphase; board = 0; renderDaev(); }
  const tbd = e.target.closest("[data-tboard]");
  if (tbd) { tBoard = +tbd.dataset.tboard; tStep = null; renderTDaev(); }
  const tst = e.target.closest("[data-tstep]");
  if (tst) { tStep = +tst.dataset.tstep; tBoard = tSteps().find(x => x.s === tStep).bi; renderTDaev(); }
  const bm = e.target.closest("[data-bossmap]");
  if (bm) { bossMapFilter = bm.dataset.bossmap; renderBoss(); return; }
  const bl = e.target.closest("[data-bosslvl]");
  if (bl) { bossLevelFilter = bl.dataset.bosslvl; renderBoss(); return; }
  const bsh = e.target.closest("[data-bossshowhidden]");
  if (bsh) { bossShowHidden = !bossShowHidden; renderBoss(); return; }
  const bfo = e.target.closest("[data-bossfavonly]");
  if (bfo) { bossFavOnly = !bossFavOnly; renderBoss(); return; }
  const bfa = e.target.closest("[data-bossfaction]");
  if (bfa) { bossFaction = bfa.dataset.bossfaction; try { localStorage.setItem("aion2BossFaction", bossFaction); } catch(e){} renderBoss(); return; }
  const ba = e.target.closest("[data-bossact]");
  if (ba) {
    const id = ba.dataset.bid;
    if (ba.dataset.bossact === "mark") markBoss(id);
    else if (ba.dataset.bossact === "settime") setBossRemaining(id);
    else if (ba.dataset.bossact === "fav") toggleFavorite(id);
    else if (ba.dataset.bossact === "rename") renameBoss(id);
    else if (ba.dataset.bossact === "hide") { const bb = allBosses().find(x => x.id === id); hideBoss(id, !(bb && bb.hidden)); }
    else if (ba.dataset.bossact === "clear") clearBoss(id);
    else if (ba.dataset.bossact === "clearall") clearAllBosses();
    return;
  }
  if (e.target.id === "bossAddBtn") { addBoss(); return; }
  const tb = e.target.closest("[data-tab]");
  if (tb) { tab = tb.dataset.tab; dphase = null; board = 0; history.replaceState(null, "", "#" + tab); render(); }
});

document.addEventListener("input", e => {
  if (e.target.id === "bossSearch") {
    bossQuery = e.target.value;
    document.querySelectorAll("[data-bossrow]").forEach(row => {
      const id = row.dataset.bossrow;
      const b = allBosses().find(x => x.id === id);
      if (!b) return;
      const q = bossQuery.toLowerCase();
      const show = !q || b.name.toLowerCase().includes(q) || b.map.toLowerCase().includes(q);
      row.style.display = show ? "" : "none";
    });
    return;
  }
  if (e.target.id === "sbdvpts") {
    const v = Math.max(0, +e.target.value || 0);
    if (sbDvBoards()[sbDvB].az) sbAzPts = v; else sbDvPts = v;
    renderSbDv(false); return;
  }
  if (e.target.id !== "tpts") return;
  tPts = Math.max(0, +e.target.value || 0);
  try { localStorage.setItem("tpts", tPts); } catch (err) {}
  renderTDaev();
});

setInterval(tickBoss, 1000);
Promise.all([fetch("skills.json").then(r => r.json()), fetch("daevanion.json").then(r => r.json())]).then(([d, dv]) => {
  SK = d; DV = dv;
  if (["#mid", "#g", "#jb", "#sb", "#me", "#x", "#t", "#boss"].includes(location.hash)) tab = location.hash.slice(1);
  render();
});
</script>
</body>
</html>
